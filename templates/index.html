<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diamond Price Prediction</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 40px;
    }
    form {
      margin: auto;
      width: 300px;
    }
    input, select {
      width: 100%;
      margin: 10px 0;
      padding: 8px;
    }
    .prediction {
      font-size: 1.5rem;
      margin-top: 20px;
      color: green;
    }
  </style>
</head>
<body>
  <h1>Diamond Price Predictor</h1>
  <form method="POST">
    <input type="text" name="carat" placeholder="Carat" required>
    <input type="text" name="depth" placeholder="Depth" required>
    <input type="text" name="table" placeholder="Table" required>
    <input type="text" name="x" placeholder="X" required>
    <input type="text" name="y" placeholder="Y" required>
    <input type="text" name="z" placeholder="Z" required>
    <input type="text" name="cut" placeholder="Cut (encoded)" required>
    <input type="text" name="color" placeholder="Color (encoded)" required>
    <input type="text" name="clarity" placeholder="Clarity (encoded)" required>
    <input type="submit" value="Predict Price">
  </form>

  {% if prediction %}
  <div class="prediction">
    Predicted Price: ${{ prediction }}
  </div>
  {% endif %}
</body>
</html>
